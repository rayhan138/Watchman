name: Stage signed Windows candidate (no publication)
on:
  workflow_dispatch:
    inputs:
      existing_run:
        description: 'Optional: retest a signed artifact from an earlier successful v2.0.2 staging run, without rebuilding or signing'
        required: false
        type: string
permissions:
  contents: read
jobs:
  stage:
    if: inputs.existing_run == ''
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Build and test the native v2.0.2 application and installer
        run: ./migration/Build-Native.ps1
      - name: Sign the final v2.0.2 installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./node_modules/.bin/tauri.cmd signer sign builds/staged/Watchman_2.0.2_x64-setup.exe
      - name: Verify signed bytes and create an offline staged feed
        run: ./migration/New-StagedFeed.ps1 builds/staged
      - uses: actions/upload-artifact@v4
        with:
          name: watchman-2.0.2-staged
          path: builds/staged/
          if-no-files-found: error

  upgrade-from-v1:
    name: Independent v1.0.5 to v2.0.2 upgrade
    needs: stage
    if: ${{ !cancelled() && (needs.stage.result == 'success' || (inputs.existing_run != '' && needs.stage.result == 'skipped')) }}
    permissions:
      actions: read
      contents: read
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: watchman-2.0.2-staged
          path: builds/staged
          github-token: ${{ github.token }}
          run-id: ${{ inputs.existing_run || github.run_id }}
      - name: Install genuine signed v1.0.5 and build the isolated updater probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./migration/Test-LegacyInstall.ps1 -NonDefaultPath
          cmake -S native -B builds/native -A x64 -DBUILD_TESTING=ON
          cmake --build builds/native --config Release --target WatchmanUpdateProtocolProbe
      - name: Verify exact staged bytes, migrate v1 startup/history, and test rollback
        run: ./migration/Test-Staging.ps1 -CurrentVersion 1.0.5 -ProbePath builds/native/Release/WatchmanUpdateProtocolProbe.exe -UpgradeScript migration/Test-Upgrade.ps1

  upgrade-from-v2:
    name: Independent v2.0.0 to v2.0.2 upgrade
    needs: stage
    if: ${{ !cancelled() && (needs.stage.result == 'success' || (inputs.existing_run != '' && needs.stage.result == 'skipped')) }}
    permissions:
      actions: read
      contents: read
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: watchman-2.0.2-staged
          path: builds/staged
          github-token: ${{ github.token }}
          run-id: ${{ inputs.existing_run || github.run_id }}
      - name: Install and verify genuine v2.0.0 at a custom path
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./migration/Test-StableInstall.ps1 -NonDefaultPath
      - name: Build the isolated v2.0.0 updater probe
        run: |
          cmake -S native -B builds/native -A x64 -DBUILD_TESTING=ON
          cmake --build builds/native --config Release --target WatchmanUpdateProtocolProbeV2
      - name: Verify exact staged bytes, update identity, and native profile continuity
        run: ./migration/Test-Staging.ps1 -CurrentVersion 2.0.0 -ProbePath builds/native/Release/WatchmanUpdateProtocolProbeV2.exe -UpgradeScript migration/Test-StableUpgrade.ps1 -UpgradeBaselineVersion 2.0.0

  upgrade-from-v201:
    name: Independent v2.0.1 to v2.0.2 upgrade
    needs: stage
    if: ${{ !cancelled() && (needs.stage.result == 'success' || (inputs.existing_run != '' && needs.stage.result == 'skipped')) }}
    permissions:
      actions: read
      contents: read
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: watchman-2.0.2-staged
          path: builds/staged
          github-token: ${{ github.token }}
          run-id: ${{ inputs.existing_run || github.run_id }}
      - name: Install and verify the immutable public v2.0.1 stable baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./migration/Test-CurrentStableInstall.ps1 -NonDefaultPath
      - name: Build the isolated v2.0.1 updater probe
        run: |
          cmake -S native -B builds/native -A x64 -DBUILD_TESTING=ON
          cmake --build builds/native --config Release --target WatchmanUpdateProtocolProbeV201
      - name: Verify exact staged bytes, update identity, and native profile continuity
        run: ./migration/Test-Staging.ps1 -CurrentVersion 2.0.1 -ProbePath builds/native/Release/WatchmanUpdateProtocolProbeV201.exe -UpgradeScript migration/Test-StableUpgrade.ps1 -UpgradeBaselineVersion 2.0.1
