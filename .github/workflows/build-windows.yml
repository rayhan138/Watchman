name: Native Windows candidate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Build, test and package x64 C++ application
        run: ./migration/Build-Native.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-native-candidate
          path: builds/staged/*.exe
          if-no-files-found: error
      - name: Install genuine signed v1.0.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./migration/Test-LegacyInstall.ps1
      - name: Exercise native upgrade
        run: ./migration/Test-Upgrade.ps1
